<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Types de Projets</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div>
                <h1>Gestion des Types de Projets</h1>
                <p class="small">Ajout et affichage dans un tableau</p>
            </div>
            <div class="actions">
                <a class="btn-link" href="/listTypeProjet.html">Voir la liste complète</a>
                <button class="secondary" onclick="logout()">Déconnexion</button>
            </div>
        </div>

        <div id="message"></div>

        <h2>Ajouter un type de projet</h2>
        <form id="formAjout">
            <input type="text" id="nom_type" placeholder="Nom du type de projet" required>
            <button type="submit">Ajouter</button>
        </form>

        <h2>Ensemble des types de projets</h2>
        <table>
            <thead>
                <tr>
                    <th>ID de type de projet</th>
                    <th>Type de projet</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tbodyTypesProjet"></tbody>
        </table>
        <button class="btn-projet" onclick="window.location.href='indexEleve.html'">Retourner</button>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/indexTypeProjet.js"></script>
</body>
</html>
