<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des projets</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div>
                <h1>Gestion des projets</h1>
                <p class="small">Ajout et affichage dans un tableau</p>
            </div>
            <div class="actions">
                <a class="btn-link" href="/listProjet.html">Voir la liste complète</a>
                <button class="secondary" onclick="logout()">Déconnexion</button>
            </div>
        </div>

        <div id="message"></div>

        <h2>Ajouter un projet</h2>
        <form id="formAjout">
            <input type="text" id="titre" placeholder="Titre" required>
            <input type="text" id="description" placeholder="Description" required>
            <input type="date" id="date" placeholder="Date" required>
            <button type="submit">Ajouter</button>
        </form>

        <h2>Ensemble des projets</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Titre</th>
                    <th>Description</th>
                    <th>Date de création</th>
                    <th>ID Élève</th>
                    <th>ID Type</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tbodyProjet"></tbody>
        </table>
        <button class="btn-projet" onclick="window.location.href='indexEleve.html'">Retourner</button>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/indexProjet.js"></script>
</body>
</html>
