<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des images</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div>
                <h1>Gestion des images</h1>
                <p class="small">Ajout et affichage dans un tableau</p>
            </div>
            <div class="actions">
                <a class="btn-link" href="/listImage.html">Voir la liste complète</a>
                <button class="secondary" onclick="logout()">Déconnexion</button>
            </div>
        </div>

        <div id="message"></div>

        <h2>Ajouter une image</h2>
        <form id="formAjout">
            <input type="url" id="image" placeholder="Image" required>
            <input type="number" id="id_numero_projet" placeholder="ID du projet" required>
            <button type="submit">Ajouter</button>
        </form>

        <h2>Ensemble des images</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Images</th>
                    <th>ID des projets</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tbodyImage"></tbody>
        </table>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/indexImage.js"></script>
</body>
</html>
